name: Mise à jour des stats
on:
  schedule: [{ cron: "0 */6 * * *" }]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/update.mjs
        env:
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
          LEETIFY_API_KEY: ${{ secrets.LEETIFY_API_KEY }}
      - run: |
          git config user.name "armanix-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data
          git diff --staged --quiet || (git commit -m "Stats mises à jour" && git push)
