name: Mise à jour des stats
on:
  schedule: [{ cron: "0 */6 * * *" }]   # toutes les 6 heures
  workflow_dispatch:                    # bouton « Run workflow »
permissions:
  contents: write
concurrency:                            # jamais deux mises à jour en même temps
  group: stats
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - name: Récupérer les stats
        run: node scripts/update.mjs
        env:
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
          LEETIFY_API_KEY: ${{ secrets.LEETIFY_API_KEY }}
      - name: Enregistrer les données
        run: |
          git config user.name "armanix-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data
          if git diff --staged --quiet; then exit 0; fi
          git commit -m "Stats mises à jour"
          git pull --rebase --autostash
          git push
      - name: Vérifier la clé Riot
        run: |
          node -e "const s=require('./data/stats.json').status||{};if(s.riot!=='ok'){console.error('Clé Riot : '+(s.riot==='refusee'?'refusée ou expirée':'absente')+'. Les stats LoL ne sont plus mises à jour.');process.exit(1)}console.log('Clé Riot OK, '+s.riotMaj+' joueurs LoL mis à jour.')"
