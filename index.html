<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Armanix</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎮</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#13101f;--surface:#1c1730;--surface2:#262040;--text:#eeeaf8;--muted:#a39dbd;--line:#2f2850;--accent:#8b6cf6;--accent-ink:#fff;--accent2:#c3b3ff;--cl:68%;color-scheme:dark}
@media (prefers-color-scheme:light){:root{--bg:#f6f4fc;--surface:#fff;--surface2:#efeafb;--text:#1c1733;--muted:#675f86;--line:#e2dcf3;--accent:#6a45e0;--accent2:#5a38c8;--cl:34%;color-scheme:light}}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:Manrope,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:1rem;line-height:1.6;background-image:radial-gradient(60rem 28rem at 50% -8rem,color-mix(in srgb,var(--accent) 22%,transparent),transparent);background-repeat:no-repeat}
a{color:inherit}:focus-visible{outline:2px solid var(--accent2);outline-offset:3px}
.wrap{max-width:84rem;margin:0 auto;padding:0 1.5rem}
nav{display:flex;justify-content:space-between;align-items:center;padding:1.25rem 0;gap:1rem;flex-wrap:wrap}
nav b{font-weight:800;font-size:1.1rem;letter-spacing:-.01em}nav b i{font-style:normal;color:var(--accent)}
nav ul{display:flex;gap:1.75rem;list-style:none;margin:0;padding:0}nav a{text-decoration:none;color:var(--muted);font-weight:500;font-size:.95rem}nav a:hover{color:var(--text)}
.hero{padding:clamp(3rem,9vw,6rem) 0 clamp(2.5rem,6vw,4rem);animation:rise .7s ease both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.eyebrow{display:inline-block;font-size:.78rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--accent2);border:1px solid var(--line);border-radius:2rem;padding:.3rem .85rem;margin-bottom:1.25rem}
h1{font-size:clamp(3rem,9vw,6.5rem);line-height:1;font-weight:800;letter-spacing:-.045em;margin:0}
h1 i{font-style:normal;color:var(--accent)}
.tag{max-width:36rem;margin:1.25rem 0 1.75rem;font-size:1.15rem;color:var(--muted)}
.hero .row{display:flex;gap:.75rem;flex-wrap:wrap;align-items:center}
.meta{color:var(--muted);font-size:.95rem;margin-left:.5rem}
.btn{display:inline-block;background:var(--accent);color:var(--accent-ink);font:inherit;font-weight:600;padding:.75rem 1.4rem;border-radius:.65rem;text-decoration:none;transition:filter .15s}
.btn:hover{filter:brightness(1.12)}
section{padding:3rem 0}
h2{font-size:clamp(1.5rem,3.5vw,2rem);letter-spacing:-.025em;margin:0 0 1.25rem;font-weight:800;line-height:1.15}
.tabs{display:inline-flex;gap:.25rem;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:.8rem;padding:.25rem;margin-bottom:1rem}
.tabs button{display:inline-flex;align-items:center;gap:.5rem;font:inherit;font-weight:600;font-size:.92rem;background:transparent;color:var(--muted);border:0;padding:.5rem 1rem;border-radius:.6rem;cursor:pointer}
.tabs button:hover{color:var(--text)}
.tabs button[aria-selected=true]{background:var(--accent);color:var(--accent-ink)}
.gi{display:inline-flex}.gi img{width:1.35rem;height:1.35rem;object-fit:contain}.gb{display:inline-grid;place-items:center;min-width:1.5rem;height:1.35rem;padding:0 .3rem;border-radius:.35rem;color:#fff;font-size:.6rem;font-weight:800;letter-spacing:.02em}
.sb{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-transform:inherit;letter-spacing:inherit;text-align:left;line-height:inherit}.sb:hover{color:var(--text)}th[aria-sort=ascending],th[aria-sort=descending]{color:var(--accent2)}
.sortbar{display:none;gap:.6rem;align-items:center;flex-wrap:wrap;margin:0 0 1rem;color:var(--muted);font-size:.9rem}
select,.sbtn{font:inherit;font-size:.9rem;background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:.5rem;padding:.4rem .7rem}.sbtn{cursor:pointer}
.scroll{overflow-x:auto}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:1rem;padding:.25rem .75rem}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:.7rem .5rem;border-bottom:1px solid var(--line);vertical-align:middle;font-size:.93rem}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--surface2)}
th{color:var(--muted);font-weight:600;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;line-height:1.3}
td:first-child{font-weight:800;white-space:nowrap}
td a{color:var(--accent2);font-weight:600;text-underline-offset:3px}
.cv{font-weight:800}
.who{display:flex;align-items:center;gap:.6rem}.who img{width:2rem;height:2rem;border-radius:50%;border:2px solid var(--line)}
.champs{display:flex;gap:.35rem}.champs img{width:2rem;height:2rem;border-radius:.45rem;border:1px solid var(--line)}
.rk{display:flex;align-items:center;gap:.5rem}.rk img,.rk svg{width:2rem;height:2rem;flex:none}
svg.sp{width:6rem;height:1.7rem;stroke:var(--accent2);fill:none;stroke-width:2;stroke-linejoin:round}
.note{color:var(--muted);font-size:.88rem;margin:1rem 0 0}.err{color:var(--accent2);font-weight:600}
footer{padding:2rem 0 3rem;color:var(--muted);font-size:.88rem}
@media (max-width:76rem){.sortbar{display:flex}.panel{background:none;border:0;padding:0}table,thead,tbody,tr,td{display:block}thead{display:none}tr{background:var(--surface);border:1px solid var(--line);border-radius:.9rem;padding:.4rem .95rem;margin-bottom:.9rem}tbody tr:hover{background:var(--surface)}td{display:flex;justify-content:space-between;align-items:center;gap:1rem;border:0;padding:.45rem 0;text-align:right}td::before{content:attr(data-label);color:var(--muted);font-size:.8rem;text-align:left}}
@media (prefers-reduced-motion:reduce){.hero{animation:none}html{scroll-behavior:auto}}
</style>
</head>
<body><div class="wrap">
<nav><b>Armanix<i>.</i></b><ul><li><a href="#stats">Stats</a></li></ul></nav>
<header class="hero"><span class="eyebrow">Équipe · Amis · PC</span><h1>Armanix<i>.</i></h1><p class="tag">Doucement le matin, pas trop vite le soir</p>
<div class="row"><a class="btn" href="#stats">Voir les stats</a><span class="meta" id="meta"></span></div></header>
<section id="stats"><h2>Stats des joueurs</h2><div class="tabs" id="tabs" role="tablist"></div>
<div class="sortbar" id="sortbar"><label>Trier par <select id="sortSel"></select></label><button class="sbtn" id="sortDir" hidden></button></div>
<div class="scroll panel"><table><thead id="thead"></thead><tbody id="tbody"></tbody></table></div><p class="note" id="note"></p></section>
<footer>Armanix, depuis la première partie ensemble. · Version 8</footer></div>
<script>
const GAMES={
 lol:{n:"League of Legends",trend:"Évolution du rang"},
 cs:{n:"Counter-Strike 2",f:["Premier","Victoires (%)","Headshots (%)","Matchs"],trend:"Évolution Premier"},
 rl:{n:"Rocket League",f:["Rang","Victoires","Buts par match","Mode favori"]},
 bf:{n:"Battlefield 6",f:["Niveau","K/D","Victoires (%)","Classe favorite"]}};
const $=id=>document.getElementById(id);
const ok=u=>{try{return /^https?:$/.test(new URL(u).protocol)?u:""}catch(e){return ""}};
const dash=x=>x==null||x===""?"—":x, pct=x=>x==null?"—":x+" %";
function h(t,a,...k){const e=document.createElement(t);for(const x in a||{})e.setAttribute(x,a[x]);k.flat().forEach(c=>e.append(c instanceof Node?c:String(c==null?"":c)));return e}
function spark(pts){if(!pts||pts.length<2)return"—";const v=pts.map(p=>p[1]),mn=Math.min(...v),mx=Math.max(...v)||1,r=(mx-mn)||1;
 const d=v.map((y,i)=>(i/(v.length-1)*100).toFixed(1)+","+(26-(y-mn)/r*24).toFixed(1)).join(" ");
 const s=document.createElementNS("http://www.w3.org/2000/svg","svg");s.setAttribute("viewBox","0 0 100 28");s.setAttribute("class","sp");s.setAttribute("preserveAspectRatio","none");
 const l=document.createElementNS("http://www.w3.org/2000/svg","polyline");l.setAttribute("points",d);s.append(l);return s}
let stats={players:[]},hist={},game="lol";
function img(kind,id,label){const v=stats.ddragon;if(!v||id==null)return"";
 return h("img",{src:"https://ddragon.leagueoflegends.com/cdn/"+v+"/img/"+kind+"/"+id+".png",alt:label||"",title:label||"",width:32,height:32,loading:"lazy",onerror:"this.style.visibility='hidden'"})}
function profil(e){const l=ok(e.link);return td("Profil",l?h("a",{href:l,target:"_blank",rel:"noopener"},"Voir"):"—")}
const TCOL={IRON:"#6b5b55",BRONZE:"#a0673a",SILVER:"#9aa7b0",GOLD:"#e0b04b",PLATINUM:"#4fb0a8",EMERALD:"#2fbf71",DIAMOND:"#5b8def",MASTER:"#b05bd6",GRANDMASTER:"#d9534f",CHALLENGER:"#f0c75e"};
function shield(tier){const ns="http://www.w3.org/2000/svg",s=document.createElementNS(ns,"svg");s.setAttribute("viewBox","0 0 24 24");
 const p=document.createElementNS(ns,"path");p.setAttribute("d","M12 2 21 6v7c0 5-4.5 8.5-9 10-4.5-1.5-9-5-9-10V6z");p.setAttribute("fill",TCOL[tier]||"#7a7a8c");p.setAttribute("stroke","rgba(255,255,255,.6)");p.setAttribute("stroke-width","1.2");s.append(p);return s}
function rankCell(r,label){const t=r&&r.tier,wrap=h("div",{class:"rk"});
 if(t){const n=t.toLowerCase(),urls=["https://raw.communitydragon.org/latest/plugins/rcp-fe-lol-shared-components/global/default/"+n+".png","https://raw.communitydragon.org/latest/plugins/rcp-fe-lol-static-assets/global/default/images/ranked-emblem/emblem-"+n+".png"];
  const im=h("img",{alt:t,title:t,width:32,height:32,loading:"lazy",src:urls[0]});let k=0;
  im.addEventListener("error",()=>{k++;if(k<urls.length)im.src=urls[k];else im.replaceWith(shield(t))});wrap.append(im)}
 else wrap.append(shield(null));
 wrap.append(dash(r&&r.rank));return td(label,wrap)}
// Couleurs : rouge (faible) > jaune (moyenne) > vert (au-dessus). Seuils [rouge, jaune, vert], à ajuster ici.
const SC={wr:[40,50,60],kda:[1.5,2.5,3.5]};
function hue(v,s){const lo=s[0],mid=s[1],hi=s[2];if(v<=lo)return 0;if(v<mid)return 55*(v-lo)/(mid-lo);if(v<hi)return 55+75*(v-mid)/(hi-mid);return 130}
function colored(text,v,sc){if(v==null||isNaN(v))return "—";return h("span",{class:"cv",style:"color:hsl("+Math.round(hue(v,sc))+" 80% var(--cl))"},text)}
const num=x=>x==null||x===""?null:parseFloat(String(x).replace(",","."));
function td(label){const k=Array.prototype.slice.call(arguments,1);return h("td",{"data-label":label},k)}
const TB={IRON:0,BRONZE:400,SILVER:800,GOLD:1200,PLATINUM:1600,EMERALD:2000,DIAMOND:2400,MASTER:2800,GRANDMASTER:2800,CHALLENGER:2800},DV={IV:0,III:100,II:200,I:300};
function rankVal(r){if(!r||!(r.tier in TB))return null;const t=String(r.rank),m=t.match(/\b(IV|III|II|I)\b/),lp=t.match(/\((\d+) LP\)/);return TB[r.tier]+(m?DV[m[1]]:0)+(lp?+lp[1]:0)}
const RLN=[["supersonic",8],["ssl",8],["grand champion",7],["champion",6],["diamant",5],["diamond",5],["platine",4],["platinum",4],["or",3],["gold",3],["argent",2],["silver",2],["bronze",1]];
function rlRank(s){const t=s.toLowerCase();for(const n of RLN){if(new RegExp("(^|[^a-zé])"+n[0]+"([^a-zé]|$)").test(t)){const d=t.match(/\b(iii|ii|i|[1-3])\b/);return n[1]*10+(d?({i:1,ii:2,iii:3}[d[1]]||+d[1]):0)}}return null}
const TXT=/favori|favorite|mode|classe|map/i;
function parseVal(lab,s,gm){if(s==null||s===""||s==="—")return null;const t=String(s);
 if(gm==="rl"&&/^rang/i.test(lab)){const r=rlRank(t);if(r!=null)return r}
 if(TXT.test(lab))return t;const m=t.replace(",",".").match(/-?\d+(\.\d+)?/);return m?+m[0]:t}
const delta=(p,k)=>{const a=(hist[p.name]||{})[k];return a&&a.length>1?a[a.length-1][1]-a[0][1]:null};
const Lp=p=>p.games.lol.d||{};
const rkCol=(l,q)=>({l,v:p=>rankVal(Lp(p)[q]),cell:p=>rankCell(Lp(p)[q],l)});
const pctCol=(l,q)=>({l,v:p=>(Lp(p)[q]||{}).wr,cell:p=>{const x=Lp(p)[q]||{};return td(l,colored(pct(x.wr),x.wr,SC.wr))}});
const kdaCol=(l,q)=>({l,v:p=>num((Lp(p)[q]||{}).kda),cell:p=>{const x=Lp(p)[q]||{};return td(l,colored(dash(x.kda),num(x.kda),SC.kda))}});
function colsFor(gm){
 const prof={l:"Profil",cell:p=>profil(p.games[gm])};
 if(gm==="lol")return[
  {l:"Joueur",text:1,v:p=>p.name,cell:p=>td("Joueur",h("div",{class:"who"},img("profileicon",Lp(p).icon,"Icône d’invocateur"),p.name))},
  rkCol("Rang solo/duo","solo"),pctCol("Victoires solo (%)","solo"),kdaCol("KDA solo (20 dernières)","solo"),
  rkCol("Rang flex","flex"),pctCol("Victoires flex (%)","flex"),kdaCol("KDA flex (20 dernières)","flex"),
  {l:"Champions favoris",cell:p=>{const c=Lp(p).champs;return td("Champions favoris",(c&&c.length)?h("div",{class:"champs"},c.map(x=>img("champion",x.id,x.name+" ("+x.n+" parties)"))):"—")}},
  {l:"Évolution du rang",v:p=>delta(p,"lol"),cell:p=>td("Évolution du rang",spark((hist[p.name]||{}).lol))},prof];
 const g=GAMES[gm];
 return[{l:"Joueur",text:1,v:p=>p.name,cell:p=>td("Joueur",p.name)}].concat(
  g.f.map((lab,k)=>({l:lab,text:TXT.test(lab),v:p=>parseVal(lab,(p.games[gm].f||[])[k],gm),cell:p=>{const v=(p.games[gm].f||[])[k]||"—";return td(lab,lab.indexOf("Victoires (%)")>=0?colored(v,num(v),SC.wr):v)}})),
  g.trend?[{l:g.trend,v:p=>delta(p,gm),cell:p=>td(g.trend,spark((hist[p.name]||{})[gm]))}]:[],[prof]);
}
const sorts={};
function sortBy(gm,i){const st=sorts[gm];sorts[gm]=!st||st.i!==i?{i,dir:"best"}:st.dir==="best"?{i,dir:"worst"}:null;render()}
const nz=v=>(v==null||(typeof v==="number"&&isNaN(v)))?null:v;
function drawTable(gm,rows){
 const cols=colsFor(gm),st=sorts[gm]||null;
 if(st){const c=cols[st.i],sg=c.text?(st.dir==="best"?1:-1):(st.dir==="best"?-1:1);
  rows=rows.slice().sort((a,b)=>{const x=nz(c.v(a)),y=nz(c.v(b));if(x==null&&y==null)return 0;if(x==null)return 1;if(y==null)return -1;
   return sg*((typeof x==="number"&&typeof y==="number")?x-y:String(x).localeCompare(String(y),"fr"))})}
 $("thead").replaceChildren(h("tr",{},...cols.map((c,i)=>{if(!c.v)return h("th",{},c.l);
  const on=st&&st.i===i,ind=on?(c.text?(st.dir==="best"?" A→Z":" Z→A"):(st.dir==="best"?" ▼":" ▲")):"";
  const b=h("button",{class:"sb",title:"Trier cette colonne"},c.l+ind);b.onclick=()=>sortBy(gm,i);
  return h("th",{"aria-sort":on?((st.dir==="best")===!c.text?"descending":"ascending"):"none"},b)})));
 $("tbody").replaceChildren(...rows.map(p=>h("tr",{},...cols.map(c=>c.cell(p)))));
 const sel=$("sortSel");sel.replaceChildren(h("option",{value:""},"Ordre par défaut"),...cols.map((c,i)=>c.v?h("option",{value:i},c.l):"").filter(Boolean));
 sel.value=st?String(st.i):"";sel.onchange=()=>{sorts[gm]=sel.value===""?null:{i:+sel.value,dir:"best"};render()};
 const d=$("sortDir");d.hidden=!st;if(st){const c=cols[st.i];d.textContent=c.text?(st.dir==="best"?"A → Z":"Z → A"):(st.dir==="best"?"Meilleur d’abord":"Moins bon d’abord")}
 d.onclick=()=>{const s=sorts[gm];if(s){sorts[gm]={i:s.i,dir:s.dir==="best"?"worst":"best"};render()}};
}
// Logos : dépose lol.png, cs.png, rl.png et bf.png (ou .svg) à côté de index.html ; sinon une pastille s'affiche
const GI={lol:["LoL","#a9792a"],cs:["CS2","#b9702a"],rl:["RL","#2a6fdb"],bf:["BF6","#4b5563"]},iconOk={};
function gameIcon(k){const t=GI[k][0],c=GI[k][1],wrap=h("span",{class:"gi"}),badge=()=>h("span",{class:"gb",style:"background:"+c},t);
 if(iconOk[k]==="badge"){wrap.append(badge());return wrap}
 const urls=[k+".png",k+".svg"];let n=0;const im=h("img",{alt:"",src:urls[0]});
 im.addEventListener("error",()=>{n++;if(n<urls.length)im.src=urls[n];else{iconOk[k]="badge";im.replaceWith(badge())}});
 wrap.append(im);return wrap}
function render(){
 $("tabs").replaceChildren(...Object.keys(GAMES).map(k=>h("button",{role:"tab","aria-selected":k===game},gameIcon(k),GAMES[k].n)).map((b,i)=>(b.onclick=()=>{game=Object.keys(GAMES)[i];render()},b)));
 const g=GAMES[game],rows=stats.players.filter(p=>p.games[game]);
 drawTable(game,rows);
 const errs=rows.filter(p=>p.games[game].error).map(p=>p.name);
 const when=stats.updatedAt?new Date(stats.updatedAt).toLocaleString("fr-FR"):"jamais";
 $("note").replaceChildren("Dernière mise à jour : "+when+". ",errs.length?h("span",{class:"err"},"Échec de mise à jour : "+errs.join(", ")):"");
}
async function load(){
 try{stats=await (await fetch("data/stats.json",{cache:"no-cache"})).json();hist=await (await fetch("data/history.json",{cache:"no-cache"})).json()}catch(e){$("note").textContent="Impossible de charger les stats."}
 render();
 $("meta").textContent=stats.players.length+" joueurs · "+Object.keys(GAMES).length+" jeux";
}
load();
</script></body></html>
